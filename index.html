<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour-over Brouwtabel</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0e0e">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0e0e0e;
    color: #c8c8c8;
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem;
  }
  .wrap { width: 100%; max-width: 580px; }
  .select-wrap { margin-bottom: 2rem; position: relative; display: inline-block; }
  select {
    appearance: none;
    background: #0e0e0e;
    border: 1px solid #2a2a2a;
    color: #e0e0e0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.5rem 2.5rem 0.5rem 1rem;
    cursor: pointer;
    outline: none;
  }
  select:hover { border-color: #444; }
  .select-arrow {
    pointer-events: none;
    position: absolute;
    right: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: #555;
    font-size: 0.7rem;
  }
  .title {
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 1.5rem;
  }
  .sub-label {
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #555;
    margin-top: 1.8rem;
    margin-bottom: 0.6rem;
  }
  .stats { display: flex; gap: 2rem; margin-bottom: 1.8rem; flex-wrap: wrap; }
  .stat-item { display: flex; flex-direction: column; gap: 0.25rem; }
  .stat-key { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: #555; }
  .stat-val { font-size: 0.85rem; color: #e0e0e0; font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  th {
    text-align: left;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #777;
    padding: 0 0 0.6rem 0;
    font-weight: 400;
    border-bottom: 1px solid #2a2a2a;
  }
  th:not(:first-child) { padding-left: 1.5rem; }
  td { padding: 0.75rem 0; border-bottom: 1px solid #1e1e1e; color: #bbb; font-weight: 300; }
  td:not(:first-child) { padding-left: 1.5rem; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { color: #eee; }
  .time { color: #e0e0e0; font-weight: 500; font-variant-numeric: tabular-nums; }
  .vol { color: #e0e0e0; }
  .note { color: #666; }
  .footer { margin-top: 2rem; font-size: 0.6rem; letter-spacing: 0.1em; color: #555; text-transform: uppercase; line-height: 1.8; }
  .footer span { color: #999; }
  .btn {
    appearance: none;
    background: #0e0e0e;
    border: 1px solid #2a2a2a;
    color: #e0e0e0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.6rem 1.2rem;
    cursor: pointer;
  }
  .btn:hover { border-color: #444; }
  .start-row { margin-bottom: 1.8rem; }
  .timer-view { display: none; }
  .timer-clock {
    font-size: 3.5rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: #e0e0e0;
    margin-bottom: 0.5rem;
    transition: color 0.15s;
  }
  .timer-clock.red { color: #ff4d4d; }
  .timer-view.done .timer-clock { color: #4dd68c; }
  .timer-view.done .timer-step { color: #4dd68c; }
  .timer-step {
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 1.8rem;
  }
  .timer-volumes { display: flex; gap: 2rem; margin-bottom: 1.5rem; }
  .timer-volumes .stat-val.red { color: #ff4d4d; }
  .timer-note { font-size: 0.8rem; color: #888; margin-bottom: 2rem; min-height: 1.2em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="select-wrap">
    <select id="recipe-select" onchange="setRecipe(this.value)">
      <option value="allround">Allround</option>
      <option value="zarza">Zarza</option>
      <option value="matteo">Matteo</option>
      <option value="lightroast">Light Roast</option>
      <option value="zen">Zen</option>
    </select>
    <span class="select-arrow">&#9660;</span>
  </div>
  <div class="title" id="title"></div>
  <div class="stats" id="stats"></div>

  <div class="start-row" id="start-row">
    <button class="btn" id="start-btn" onclick="startTimer()">&#9654; Start</button>
  </div>

  <div id="recipe-view">
    <div class="sub-label">Stappenplan</div>
    <table>
      <thead>
        <tr>
          <th>Tijd</th>
          <th>Stap</th>
          <th>Tot</th>
          <th>Notitie</th>
        </tr>
      </thead>
      <tbody id="steps"></tbody>
    </table>
    <div class="footer" id="footer"></div>
  </div>

  <div class="timer-view" id="timer-view">
    <div class="timer-clock" id="timer-clock">0:00</div>
    <div class="timer-step" id="timer-step"></div>
    <div class="timer-volumes">
      <div class="stat-item"><span class="stat-key">Now</span><span class="stat-val" id="timer-now"></span></div>
      <div class="stat-item"><span class="stat-key">Next</span><span class="stat-val" id="timer-next"></span></div>
    </div>
    <div class="timer-note" id="timer-note"></div>
    <button class="btn" id="stop-btn" onclick="stopTimer()">&#9632; Stop</button>
  </div>
</div>
<script>
var recipes = {
  allround: {
    name: 'Allround',
    koffie: '18 g',
    water: '300 ml',
    temp: '94°C',
    stand: '6–7',
    steps: [
      ['0:00', 'Bloom',        '60 ml',  'Rondje gieten, 40 sec wachten'],
      ['0:40', 'Pour 2',       '130 ml', 'Rondje gieten'],
      ['1:20', 'Pour 3',       '210 ml', 'Rondje gieten'],
      ['2:00', 'Pour 4',       '300 ml', 'Rondje gieten'],
      ['2:30–3:30', 'Klaar', '—', 'Laat volledig draineren']
    ],
    footer: 'Zuur → <span>grover</span> &nbsp;·&nbsp; Bitter → <span>fijner</span><br>Giet wanneer waterpeil het koffiebed bereikt'
  },
  zarza: {
    name: 'Zarza',
    koffie: '12 g',
    water: '200 ml',
    temp: '90–92°C',
    stand: '6–7',
    steps: [
      ['0:00', 'Bloom',        '40 ml',  'Rondje gieten, 40 sec wachten'],
      ['0:40', 'Pour 2',       '90 ml',  'Rondje gieten'],
      ['1:20', 'Pour 3',       '150 ml', 'Rondje gieten'],
      ['2:00', 'Pour 4',       '200 ml', 'Rondje gieten'],
      ['2:30–3:00', 'Klaar', '—', 'Laat volledig draineren']
    ],
    footer: 'Lagere temp → <span>meer fruitigheid</span><br>Giet wanneer waterpeil het koffiebed bereikt &nbsp;·&nbsp; Giet rustig'
  },
  matteo: {
    name: 'Matteo',
    koffie: '15 g',
    water: '250 ml',
    temp: '94°C',
    stand: '6–7',
    steps: [
      ['0:00', 'Bloom',        '50 ml',  'Rondje gieten, 40 sec wachten'],
      ['0:40', 'Pour 2',       '90 ml',  'Rondje gieten'],
      ['1:20', 'Pour 3',       '130 ml', 'Rondje gieten'],
      ['2:00', 'Pour 4',       '170 ml', 'Rondje gieten'],
      ['2:40', 'Pour 5',       '210 ml', 'Rondje gieten'],
      ['3:20', 'Pour 6',       '250 ml', 'Rondje gieten'],
      ['~4:00', 'Klaar',       '—', 'Laat volledig draineren']
    ],
    footer: 'Zoetheid staat centraal · 40 sec tussen elke pour<br>Giet wanneer waterpeil het koffiebed bereikt'
  },
  lightroast: {
    name: 'Light Roast',
    koffie: '18 g',
    water: '300 ml',
    temp: '90°C',
    stand: '5–6',
    steps: [
      ['0:00', 'Bloom',        '60 ml',  'Rondje gieten, 45 sec wachten'],
      ['0:45', 'Pour 2',       '130 ml', 'Rondje gieten'],
      ['1:25', 'Pour 3',       '210 ml', 'Rondje gieten'],
      ['2:05', 'Pour 4',       '300 ml', 'Rondje gieten'],
      ['2:30–3:30', 'Klaar', '—', 'Laat volledig draineren']
    ],
    footer: 'Lagere temp → <span>meer fruitigheid</span> · Fijnere maling<br>Giet wanneer waterpeil het koffiebed bereikt'
  },
  zen: {
    name: 'Zen',
    koffie: '15 g',
    water: '240 ml',
    temp: '94°C',
    stand: '6–7',
    steps: [
      ['0:00', 'Bloom',        '50 ml',  'Rondje gieten, 50 sec wachten'],
      ['0:50', 'Pour 2',       '120 ml', 'Rondje gieten'],
      ['1:30', 'Pour 3',       '180 ml', 'Rustig gieten'],
      ['2:00', 'Pour 4',       '240 ml', 'Rustig gieten'],
      ['3:00–3:15', 'Klaar', '—', 'Laat volledig draineren']
    ],
    footer: 'Zuur → <span>grover</span> &nbsp;·&nbsp; Bitter → <span>fijner</span><br>Giet wanneer waterpeil het koffiebed bereikt'
  }
};

var currentRecipeName = 'allround';

function setRecipe(name) {
var r = recipes[name];
if (!r) return;
currentRecipeName = name;
document.getElementById('title').textContent = 'Orea O1 · Hario Mini Slim · ' + r.name + ' · Kalita Wave 155';
var statsHTML = '';
var statsData = [
{ key: 'Koffie', val: r.koffie },
{ key: 'Water',  val: r.water  },
{ key: 'Temp',   val: r.temp   },
{ key: 'Stand',  val: r.stand  }
];
for (var i = 0; i < statsData.length; i++) {
statsHTML += '<div class="stat-item"><span class="stat-key">' + statsData[i].key + '</span><span class="stat-val">' + statsData[i].val + '</span></div>';
}
document.getElementById('stats').innerHTML = statsHTML;
var stepsHTML = '';
for (var j = 0; j < r.steps.length; j++) {
var st = r.steps[j];
stepsHTML += '<tr><td class="time">' + st[0] + '</td><td>' + st[1] + '</td><td class="vol">' + st[2] + '</td><td class="note">' + st[3] + '</td></tr>';
}
document.getElementById('steps').innerHTML = stepsHTML;
document.getElementById('footer').innerHTML = r.footer;
}

setRecipe('allround');

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js');
}

// --- Timer ---

var wakeLock = null;
var timerInterval = null;
var timerStart = null;
var timerEndSeconds = null;
var lastBeepSecond = null;
var audioCtx = null;

function parseTime(str) {
  var m = str.replace('~', '').match(/^(\d+):(\d+)/);
  if (!m) return 0;
  return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
}

function parseEndTime(str) {
  var matches = str.match(/\d+:\d+/g);
  if (!matches) return parseTime(str);
  var last = matches[matches.length - 1].split(':');
  return parseInt(last[0], 10) * 60 + parseInt(last[1], 10);
}

function getTimedSteps(r) {
  return r.steps.map(function (st) {
    return { label: st[1], vol: st[2], note: st[3], seconds: parseTime(st[0]) };
  });
}

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) {}
}

function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release().catch(function () {});
    wakeLock = null;
  }
}

document.addEventListener('visibilitychange', function () {
  if (timerInterval && document.visibilityState === 'visible') {
    requestWakeLock();
  }
});

function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  } catch (e) {}
}

function startTimer() {
  var r = recipes[currentRecipeName];
  var steps = getTimedSteps(r);
  timerEndSeconds = parseEndTime(r.steps[r.steps.length - 1][0]);

  document.querySelector('.select-wrap').style.display = 'none';
  document.getElementById('start-row').style.display = 'none';
  document.getElementById('recipe-view').style.display = 'none';
  document.getElementById('timer-view').style.display = 'block';
  document.getElementById('timer-view').classList.remove('done');

  requestWakeLock();

  lastBeepSecond = null;
  timerStart = Date.now();
  renderTimer(steps, 0);
  timerInterval = setInterval(function () {
    var elapsed = Math.floor((Date.now() - timerStart) / 1000);
    renderTimer(steps, elapsed);
  }, 200);
}

function renderTimer(steps, elapsed) {
  var finished = elapsed >= timerEndSeconds;
  var displayElapsed = finished ? timerEndSeconds : elapsed;

  var idx = 0;
  for (var i = 0; i < steps.length; i++) {
    if (steps[i].seconds <= displayElapsed) idx = i;
  }
  var cur = steps[idx];
  var next = steps[idx + 1];

  var mm = Math.floor(displayElapsed / 60);
  var ss = displayElapsed % 60;
  var remaining = next ? next.seconds - displayElapsed : null;
  var isRed = remaining !== null && remaining >= 0 && remaining <= 5;

  var clockEl = document.getElementById('timer-clock');
  clockEl.textContent = mm + ':' + (ss < 10 ? '0' : '') + ss;
  clockEl.classList.toggle('red', isRed);

  document.getElementById('timer-step').textContent = finished ? 'Klaar' : cur.label;
  document.getElementById('timer-note').textContent = finished ? 'Klaar om te drinken' : cur.note;

  var nowEl = document.getElementById('timer-now');
  var nextEl = document.getElementById('timer-next');
  nowEl.textContent = 'now: ' + cur.vol;
  nextEl.textContent = 'next: ' + (next ? next.vol : '—');
  nowEl.classList.toggle('red', isRed);
  nextEl.classList.toggle('red', isRed);

  if (isRed && remaining !== lastBeepSecond) {
    lastBeepSecond = remaining;
    beep();
  } else if (!isRed) {
    lastBeepSecond = null;
  }

  if (finished && timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
    releaseWakeLock();
    document.getElementById('timer-view').classList.add('done');
  }
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timerEndSeconds = null;
  releaseWakeLock();
  document.querySelector('.select-wrap').style.display = '';
  document.getElementById('start-row').style.display = '';
  document.getElementById('recipe-view').style.display = '';
  document.getElementById('timer-view').style.display = 'none';
  document.getElementById('timer-view').classList.remove('done');
}
</script>

</body>
</html>
